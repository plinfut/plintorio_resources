[mod-name]
plintorio_resources=Plintorio - Resource Creator

[mod-description]
plintorio_resources=Allows players to quickly create rectangle resource patches.
[mod-setting-name]
plintorio_resources_filter_native=Filter native?
plintorio_resources_resource_amount=Resource amount

[mod-setting-description]
plintorio_resources_filter_native=Only allow the management of resources native to the current planet? Disable to manage all resources on all planets.
plintorio_resources_resource_amount=The amount of ores that can be extracted from each ore patch tile before it disappears. Maximum: 400 million. This only applies to ore patches created after changing this setting.
